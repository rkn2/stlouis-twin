<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Twin</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f1f3f5; --surface:#ffffff; --ink:#18202a; --ink-2:#465262; --muted:#6c7888; --line:#d9dfe6; --grid:#eceff3;
  --accent:#1e5f8e; --accent-soft:#e2edf6; --warn:#a86a00; --ring:#ffffff;
  /* damage states: DS0 neutral, DS1-4 one ordinal hue; on dark the ramps run dark->light so more damage stands out (both validated) */
  --ds0:#a8a69f; --ds1:#ec9560; --ds2:#d9652f; --ds3:#b03d18; --ds4:#6e1a0a;
  /* EF zones: one sequential blue */
  --ef0:#b7d3f6; --ef1:#6da7ec; --ef2:#2a78d6; --ef3:#104281;
  /* residual: blue (less damage than predicted) <-> gray <-> red (more) */
  --rn3:#104281; --rn2:#2a78d6; --rn1:#86b6ef; --r0:#cfcdc6; --rp1:#f2a7a0; --rp2:#e34948; --rp3:#9e2323;
  --s1:#2a78d6; --s2:#eb6834;
  /* demolition: status colours (always with a label) */ --dm2:#d03b3b; --dm1:#fab219; --dm0:#c9c7bf;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:Bitter,Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0e1216; --surface:#161c22; --ink:#e7ecf1; --ink-2:#b3bdc8; --muted:#8793a0; --line:#28313a; --grid:#1f262e;
    --accent:#7fb6e0; --accent-soft:#1b2833; --warn:#e2a93a; --ring:#11161c;
    --ds0:#77756e; --ds1:#b8441c; --ds2:#de6331; --ds3:#ef9563; --ds4:#f7c4a2;
    --ef0:#1c5cab; --ef1:#2a78d6; --ef2:#5598e7; --ef3:#9ec5f4;
    --rn3:#9ec5f4; --rn2:#3987e5; --rn1:#1c5cab; --r0:#5a5955; --rp1:#9e2323; --rp2:#e34948; --rp3:#f2a7a0;
    --s1:#3987e5; --s2:#d95926; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0e1216; --surface:#161c22; --ink:#e7ecf1; --ink-2:#b3bdc8; --muted:#8793a0; --line:#28313a; --grid:#1f262e;
  --accent:#7fb6e0; --accent-soft:#1b2833; --warn:#e2a93a; --ring:#11161c;
  --ds0:#77756e; --ds1:#b8441c; --ds2:#de6331; --ds3:#ef9563; --ds4:#f7c4a2;
    --ef0:#1c5cab; --ef1:#2a78d6; --ef2:#5598e7; --ef3:#9ec5f4;
    --rn3:#9ec5f4; --rn2:#3987e5; --rn1:#1c5cab; --r0:#5a5955; --rp1:#9e2323; --rp2:#e34948; --rp3:#f2a7a0;
  --s1:#3987e5; --s2:#d95926; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.wrap{display:flex;flex-direction:column;min-height:100%;max-width:1500px;margin:0 auto;padding:12px 16px 24px;gap:10px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{margin:0;font:600 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 24px/1.2 var(--serif)}
.sub{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.meta{font:12px var(--mono);color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.chip input{margin:0;accent-color:var(--accent)}
.chip select{font:inherit;border:0;background:transparent;color:var(--ink);padding:0}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:10px;min-height:0}
#map{height:min(76vh,1400px);min-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;height:min(76vh,1400px);min-height:420px}
@media (max-width:900px){ main{grid-template-columns:1fr} #map{height:62vh} .panel{height:auto} }
.panel h2{margin:0 0 6px;font:700 17px/1.3 var(--serif)}
.panel h3{margin:16px 0 6px;font:600 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.headline{font-size:15px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px}
.stat b{display:block;font:600 20px/1.1 var(--sans)}
.stat span{font-size:11.5px;color:var(--muted)}
.loop{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.loop li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start}
.loop .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--sans);color:#fff;margin-top:1px}
.ic.done{background:#0ca30c}.ic.blocked{background:#d03b3b}.ic.started{background:#1e5f8e}.ic.todo{background:var(--muted)}
.loop b{font-weight:600}.loop p{margin:0;color:var(--ink-2);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 6px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:11.5px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.back{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.legend{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.35;max-width:220px}
.legend b{display:block;font-weight:600;margin-bottom:4px}
.legend .row{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid var(--ring)}
.sw.sq{border-radius:2px}
.sw.hollow{background:transparent!important;border:1.5px solid var(--muted)}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-tooltip{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{font:11px var(--sans);fill:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.seg button{border:0;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12px;padding:3px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.swipe{position:absolute;top:0;bottom:0;width:0;z-index:650;pointer-events:none}
.swipe::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6)}
.swipe input{pointer-events:auto;position:absolute;top:50%;left:-14px;width:28px;height:28px;margin:0;opacity:0;cursor:ew-resize}
.swipe span{position:absolute;top:calc(50% - 14px);left:-14px;width:28px;height:28px;border-radius:50%;background:#fff;color:#18202a;display:grid;place-items:center;font:700 13px var(--sans);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.swipe b{position:absolute;top:8px;font:600 11.5px var(--sans);color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:4px;white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pair figure{margin:0}.pair canvas{width:100%;aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--grid);display:block}
.pair figcaption{font-size:11.5px;color:var(--muted);margin-top:2px}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2000}
details.about{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
details.about summary{cursor:pointer;font-weight:600}
details.about p{color:var(--ink-2);max-width:900px}
a{color:var(--accent)}
#status{padding:20px;color:var(--muted)}
#status pre{white-space:pre-wrap;color:var(--warn);font:12px var(--mono)}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:5000;padding:16px}
#gate form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:10px;width:min(360px,100%)}
#gate input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#gate button{font:inherit;font-weight:600;padding:8px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Penn State Heritage 3D Lab · Digital Twin Hub</p>
      <h1 id="title">Digital twin</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="controls" role="group" aria-label="Layers">
    <label class="chip">Buildings <select id="color" aria-label="Color buildings by">
      <option value="ds">observed damage</option>
      <option value="res">observed minus IN-CORE</option>
      <option value="arch">archetype</option>
      <option value="yb">year built</option>
      <option value="demo">demolished since the tornado</option>
    </select></label>
    <label class="chip" id="imgChip" hidden>Imagery <select id="img" aria-label="Aerial imagery">
      <option value="off">off</option><option value="before">before</option><option value="after">after</option><option value="swipe">before | after swipe</option>
    </select></label>
    <label class="chip"><input type="checkbox" id="lyrB" checked> Surveyed buildings</label>
    <label class="chip"><input type="checkbox" id="lyrEF" checked> NWS EF zones</label>
    <label class="chip"><input type="checkbox" id="lyrT" checked> Track</label>
    <label class="chip"><input type="checkbox" id="lyrN"> NWS damage points</label>
    <label class="chip"><input type="checkbox" id="lyrG"> Unsurveyed pre-1950 parcels</label>
    <label class="chip"><input type="checkbox" id="lyrD"> Demolition permits since the tornado</label>
    <label class="chip">EF zone <select id="efF" aria-label="Filter by EF zone"><option value="all">all</option><option value="0">EF0</option><option value="1">EF1</option><option value="2">EF2</option><option value="3">EF3</option></select></label>
  </div>
  <div id="status">Loading…</div>
  <main>
    <div id="map" role="application" aria-label="Map"></div>
    <aside class="panel" id="panel" aria-label="Details"></aside>
  </main>
  <details class="about">
    <summary>About this twin and its data</summary>
    <div id="about"></div>
    <p><button class="back" id="forget" type="button">Forget this device (sign out)</button></p>
  </details>
</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------------------------------------------------------------- data access (plain in dev, AES-GCM behind the gate when published)
let KEY = null, FORGET = null;
const DATA = "data/";
async function getBuf(name){
  const url = DATA + name + (KEY ? ".enc" : "");
  let res = await fetch(url);
  // GitHub Pages answers the odd burst of tile requests with a transient 503 (seen 2026-10-07; the same file
  // returned 200 a moment later), so retry a 5xx once and say so in the console
  if (res.status >= 500){ console.warn(`${url}: HTTP ${res.status}, retrying once`); await new Promise(r => setTimeout(r, 600)); res = await fetch(url); }
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const buf = await res.arrayBuffer();
  if (!KEY) return buf;
  const u = new Uint8Array(buf);
  try { return await crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(0,12)}, KEY, u.slice(12)); }
  catch(e){ throw new Error(`${url}: decrypt failed (${e.name})`); }
}
const getJSON = async n => JSON.parse(new TextDecoder().decode(await getBuf(n)));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//i.test(String(u || "")) ? String(u) : "#";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (v, d=2) => v == null || !isFinite(v) ? "–" : (+v).toFixed(d);
const DSN = ["DS0 none", "DS1 slight", "DS2 moderate", "DS3 extensive", "DS4 complete"];

let R, L_D, S, B, G, N, M, map, base, L_B, L_EF, L_T, L_N, L_G, nB = 0;
const dark = () => document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);

// ---------------------------------------------------------------- colour encodings
function resBin(r){ return r == null ? null : r <= -2 ? "--rn3" : r <= -1 ? "--rn2" : r < -0.33 ? "--rn1" : r <= 0.33 ? "--r0" : r <= 1 ? "--rp1" : r <= 2 ? "--rp2" : "--rp3"; }
const YB = [[1880,"--ef0"],[1900,"--ef1"],[1920,"--ef2"],[9999,"--ef3"]];
function bColor(i){
  const c = B.cols, mode = $("color").value;
  if (mode === "ds") return c.ds[i] < 0 ? null : css("--ds" + c.ds[i]);
  if (mode === "res"){ const v = c.ds[i] < 0 || c.eInc[i] == null ? null : c.ds[i] - c.eInc[i]; const k = resBin(v); return k && css(k); }
  if (mode === "arch") return css(c.arch[i] === 6 ? "--s2" : "--s1");
  if (mode === "yb"){ const y = c.yb[i]; if (y == null) return null; return css(YB.find(([t]) => y < t)[1]); }
  if (mode === "demo") return c.demo[i] < 0 ? null : css("--dm" + c.demo[i]);
}
function legend(){
  const mode = $("color").value, row = (cls, label, sq) => `<div class="row"><span class="sw${sq ? " sq" : ""}${cls ? "" : " hollow"}" style="background:${cls ? css(cls) : ""}"></span>${esc(label)}</div>`;
  let h = "";
  if (mode === "ds") h = "<b>Observed damage</b>" + [0,1,2,3,4].map(k => row("--ds" + k, DSN[k])).join("") + row(null, "no rating");
  if (mode === "res") h = "<b>Observed − IN-CORE expected (DS)</b>" + [["--rn3","≤ −2 (far less damage)"],["--rn2","−2 to −1"],["--rn1","−1 to −⅓"],["--r0","about as predicted"],["--rp1","⅓ to 1"],["--rp2","1 to 2"],["--rp3","> 2 (far more damage)"]].map(([k,l]) => row(k,l)).join("") + row(null, "no rating");
  if (mode === "arch") h = "<b>IN-CORE archetype</b>" + row("--s1","T19 low-rise (masonry, 2+ storeys)") + row("--s2","T6 one-storey commercial");
  if (mode === "demo") h = "<b>City demolition record</b>" + row("--dm2", "demolished (completed permit or City demolition date)") + row("--dm1", "permit filed, not yet completed") + row("--dm0", "no demolition recorded") + row(null, "outside the City: no City data");
  if (mode === "yb") h = "<b>Year built (assessor)</b>" + row("--ef0","before 1880") + row("--ef1","1880–1899") + row("--ef2","1900–1919") + row("--ef3","1920 or later") + row(null,"unknown");
  if ($("lyrEF").checked) h += "<b style='margin-top:6px'>NWS EF zone</b>" + [0,1,2,3].map(k => row("--ef" + k, "EF" + k, true)).join("");
  if ($("lyrD").checked) h += `<div class="row" style="margin-top:6px"><span class="sw sq" style="background:${css("--dm2")};opacity:.5"></span>demolition permit parcel (filed since May 16, 2025)</div>`;
  if ($("lyrG").checked) h += `<div class="row" style="margin-top:6px"><span class="sw sq" style="background:transparent;border:1.5px dashed ${css("--ink-2")}"></span>unsurveyed parcel</div>`;
  legendCtl.getContainer().innerHTML = h;
}

// ---------------------------------------------------------------- layers
function drawBuildings(){
  L_B.clearLayers(); nB = 0;
  const c = B.cols, ef = $("efF").value, ring = css("--ring");
  const order = c.lat.map((_, i) => i).sort((a, b) => c.ds[a] - c.ds[b]);   // most damaged on top
  for (const i of order){
    if (ef !== "all" && c.ef[i] !== +ef) continue;
    const col = bColor(i);
    const m = L.circleMarker([c.lat[i], c.lon[i]], {radius:4, weight:col ? 0.8 : 1.4, color:col ? ring : css("--muted"), fillColor:col || "transparent", fillOpacity:col ? 0.95 : 0, renderer:canvas});
    m.on("click", () => renderBuilding(i)); m.on("mouseover", () => m.bindTooltip(tipB(i), {direction:"top", offset:[0,-4]}).openTooltip());
    L_B.addLayer(m); nB++;
  }
  legend();
}
function tipB(i){ const c = B.cols; return `${c.ds[i] >= 0 ? DSN[c.ds[i]] : "no rating"} · T${c.arch[i]} · ${c.ef[i] >= 0 ? "EF" + c.ef[i] : "outside EF zones"}${c.yb[i] ? " · " + c.yb[i] : ""}`; }
function drawEF(){
  L_EF.clearLayers();
  const order = N.polygons.slice().sort((a, b) => a.ef.localeCompare(b.ef));
  for (const p of order){ const k = +p.ef.replace("EF",""); L.geoJSON(p.geom, {style:{color:css("--ef" + k), weight:1, fillColor:css("--ef" + k), fillOpacity:0.18}, interactive:false}).addTo(L_EF); }
}
function drawTrack(){
  L_T.clearLayers();
  for (const t of N.lines){ const g = L.geoJSON(t.geom, {style:{color:css("--ink"), weight:2, dashArray:"6 4"}}); g.on("click", () => renderTrack(t)); g.addTo(L_T); }
}
function drawNWS(){
  L_N.clearLayers();
  const p = N.points, ring = css("--ring");
  for (let i = 0; i < p.lat.length; i++){
    const k = /^EF(\d)/.exec(p.ef[i]); const col = k ? css("--ef" + k[1]) : css("--muted");
    const m = L.circleMarker([p.lat[i], p.lon[i]], {radius:2.5, weight:0.5, color:ring, fillColor:col, fillOpacity:0.9, renderer:canvas});
    m.bindTooltip(() => `${esc(p.ef[i])}${p.wind[i] ? " · " + p.wind[i] + " mph" : ""}<br>${esc(N.di[p.di[i]])}<br>${esc(N.dod[p.dod[i]] || "")}`);
    L_N.addLayer(m);
  }
}
function drawGap(){
  L_G.clearLayers();
  for (let i = 0; i < G.lat.length; i++){
    const m = L.circleMarker([G.lat[i], G.lon[i]], {radius:3, weight:1, dashArray:"2 2", color:css("--ink-2"), fillOpacity:0, renderer:canvas});
    m.bindTooltip(() => `Unsurveyed parcel${G.yb[i] ? " · built " + G.yb[i] : ""}${G.hd[i] ? " · National Register district" : ""}`);
    L_G.addLayer(m);
  }
}
function drawPermits(){
  L_D.clearLayers();
  for (const p of R.permits){
    const g = L.geoJSON(p.geom, {style:{color:css("--dm2"), weight:1, fillColor:css(p.PermitStatus === "Completed" ? "--dm2" : "--dm1"), fillOpacity:0.45}});
    g.bindTooltip(`Demolition permit · ${esc(p.PermitStatus)}<br>${esc(p.StructureDescription || "structure not given")} · filed ${esc(p.submitted)}${p.closed ? " · closed " + esc(p.closed) : ""}<br>${esc(p.BidPackage_ParcelSourcingType)} · ${esc(p.BidPackage_FundingSource)}`);
    g.addTo(L_D);
  }
}
function syncLayers(){
  for (const [id, l] of [["lyrB", L_B], ["lyrEF", L_EF], ["lyrT", L_T], ["lyrN", L_N], ["lyrG", L_G], ["lyrD", L_D]]) $(id).checked ? l.addTo(map) : l.remove();
  if ($("lyrD").checked && !L_D.getLayers().length) drawPermits();
  if ($("lyrN").checked && !L_N.getLayers().length) drawNWS();
  if ($("lyrG").checked && !L_G.getLayers().length) drawGap();
  legend();
}
function setBase(){   // Esri canvas tiles need no key or referrer (the page sends none)
  for (const l of base || []) l.remove();
  const svc = dark() ? "Canvas/World_Dark_Gray" : "Canvas/World_Light_Gray", u = s => `https://server.arcgisonline.com/ArcGIS/rest/services/${svc}_${s}/MapServer/tile/{z}/{y}/{x}`;
  base = [L.tileLayer(u("Base"), {maxZoom:19, maxNativeZoom:16, attribution:"Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors"}).addTo(map),
          L.tileLayer(u("Reference"), {maxZoom:19, maxNativeZoom:16, pane:"overlayPane", opacity:0.9}).addTo(map)];
}

// ---------------------------------------------------------------- licensed aerial imagery (encrypted tiles, if this build has them)
let NM = null, NMH = {}, nmLayers = {}, swipeEl = null;
const nmHas = (e, z, x, y) => NMH[e] && NMH[e][z] && NMH[e][z].has(x + "/" + y);
const EncTiles = L.GridLayer.extend({
  createTile(c, done){
    const img = document.createElement("img"); img.alt = "";

function initImagery(){

  L.DomEvent.disableClickPropagation(swipeEl);

  sp.style.pointerEvents = "auto"; sp.style.cursor = "ew-resize";

function clip(){

function setImagery(){

// before/after close-up around one point: decrypt the covering tiles and draw a 120 m square
async function closeup(epoch, lat, lon, cv){
  const n0 = 2 ** 19, inCore = nmHas(epoch, 19, Math.floor((lon + 180) / 360 * n0), Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n0));
  const z = inCore ? 19 : 18, n = 2 ** z;
  const fx = (lon + 180) / 360 * n * 256, fy = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n * 256;
  const half = 60 / (156543.03 * Math.cos(lat * Math.PI / 180) / n);    // 60 m in pixels at zoom z
  const S = cv.width = cv.height = 320, k = S / (2 * half), g = cv.getContext("2d"); let drew = 0;
  const x0 = Math.floor((fx - half) / 256), x1 = Math.floor((fx + half) / 256), y0 = Math.floor((fy - half) / 256), y1 = Math.floor((fy + half) / 256);
  await Promise.all([...Array((x1 - x0 + 1) * (y1 - y0 + 1)).keys()].map(async i => {
    const x = x0 + i % (x1 - x0 + 1), y = y0 + Math.floor(i / (x1 - x0 + 1));
    if (!nmHas(epoch, z, x, y)) return;
    let buf; try { buf = await getBuf(`nm/${epoch}/${z}/${x}/${y}.jpg`); } catch(e){ console.error(e); return; }   // draw the rest of the close-up
    const bmp = await createImageBitmap(new Blob([buf], {type:"image/jpeg"}));
    g.drawImage(bmp, (x * 256 - fx + half) * k, (y * 256 - fy + half) * k, 256 * k, 256 * k); drew++;
  }));
  if (!drew){ g.fillStyle = css("--muted"); g.font = "13px system-ui"; g.textAlign = "center"; g.fillText("no capture here", S / 2, S / 2); return false; }
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.beginPath(); g.arc(S / 2, S / 2, 9, 0, 2 * Math.PI); g.stroke();
  g.strokeStyle = "rgba(0,0,0,.6)"; g.lineWidth = 1; g.beginPath(); g.arc(S / 2, S / 2, 11, 0, 2 * Math.PI); g.stroke();
  return true;
}

// lognormal CDF via erf
function erf(x){ const t = 1 / (1 + 0.3275911 * Math.abs(x)), y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; }

  const bands = Object.entries(M.ef_ranges).map(([ef, [lo, hi]]) => `<rect x="${X(lo)}" y="${P.t}" width="${X(Math.min(hi, x1)) - X(lo)}" height="${H - P.t - P.b}" fill="${css("--ef" + ef)}" opacity="${ef % 2 ? .16 : .08}"/><text x="${(X(lo) + X(Math.min(hi, x1))) / 2}" y="${P.t + 11}" text-anchor="middle">EF${ef}</text>`).join("");
  const grid = [0, .5, 1].map(p => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(p)}" y2="${Y(p)}" stroke="${css("--grid")}"/><text x="${P.l - 5}" y="${Y(p) + 4}" text-anchor="end">${p}</text>`).join("")
    + [50, 100, 150, 200].map(v => `<text x="${X(v)}" y="${H - 10}" text-anchor="middle">${v}</text>`).join("") + `<text x="${W - P.r}" y="${H - 10}" text-anchor="end">mph</text>`;
  const lines = series.map(([k, c]) => `<path d="${path(k)}" fill="none" stroke="${css(c)}" stroke-width="2"/>`).join("");
  const labels = series.map(([k, c, l]) => { const m = M.frag[k].median_mph[ls]; return `<circle cx="${X(m)}" cy="${Y(.5)}" r="4" fill="${css(c)}" stroke="${css("--surface")}" stroke-width="2"/><text x="${X(m) + (k === "t19" ? -6 : 6)}" y="${Y(.5) + (k === "t19" ? -8 : 16)}" text-anchor="${k === "t19" ? "end" : "start"}" style="fill:${css("--ink-2")}">${l} ${m}</text>`; }).join("");
  $("frag").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Probability of reaching DS${ls + 1} or worse against wind speed, T19 vs fitted T20">${bands}${grid}${lines}${labels}<line id="xh" y1="${P.t}" y2="${H - P.b}" stroke="${css("--muted")}" visibility="hidden"/><rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent" id="hit"/></svg>
    <p class="meta" style="margin:2px 0 0">P(DS≥${ls + 1}) vs 3-s gust. Dots mark the medians. T20 is fitted to these same observations.</p>`;

    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W, w = Math.round(x0 + (sx - P.l) / (W - P.l - P.r) * (x1 - x0));

  };

let canvas, legendCtl;
const q = (a, f) => { const v = a.slice().sort((x, y) => x - y); return v[Math.floor(f * (v.length - 1))]; };

// ---------------------------------------------------------------- gate (published copy only; dev copy has no gate.json)
(async function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let Gt = null;
  try { const r = await fetch("gate.json"); if (r.ok) Gt = await r.json(); } catch(e){}
  if (!Gt) return boot();
  const gate = document.createElement("div"); gate.id = "gate";
  gate.innerHTML = `<form id="gateform"><p class="eyebrow">Penn State Heritage 3D Lab</p><h1 style="font-size:22px">Digital twin</h1>
    <label for="pw" class="sub">Enter the password to view.</label><input id="pw" type="password" autocomplete="current-password" required>
    <label class="sub" style="display:flex;gap:8px;align-items:center"><input id="remember" type="checkbox" checked> Remember on this device for 30 days</label>
    <button type="submit">View</button><p id="gatemsg" class="sub" role="alert" style="margin:0;min-height:1.2em"></p></form>`;
  document.body.appendChild(gate); document.querySelector(".wrap").inert = true; $("pw").focus();
  const tryKey = async k => { const u = b64(Gt.check); try { await crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(0,12)}, k, u.slice(12)); return true; } catch(e){ return false; } };
  const open = k => { KEY = k; gate.remove(); document.querySelector(".wrap").inert = false; FORGET = idbDel; boot(); };
  // "Remember" keeps a non-extractable CryptoKey in IndexedDB (never raw key bytes), expiring after 30 days.
  // The store name is unique to this twin: every twin shares the rkn2.github.io origin.
  const DB = "stl-twin";
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idbGet = async () => { const db = await idb(); return new Promise(res => { const q = db.transaction("k").objectStore("k").get("key"); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); };
  const idbPut = async v => { const db = await idb(); return new Promise(res => { const t = db.transaction("k", "readwrite"); t.objectStore("k").put(v, "key"); t.oncomplete = res; t.onerror = res; }); };
  const idbDel = async () => { try { const db = await idb(); db.transaction("k", "readwrite").objectStore("k").delete("key"); } catch(e){} };
  try { const s = await idbGet();
    if (s && s.exp > Date.now() && s.salt === Gt.salt && await tryKey(s.key)) return open(s.key);
    if (s) await idbDel(); } catch(e){}
  $("gateform").addEventListener("submit", async e => {
    e.preventDefault(); const msg = $("gatemsg"); msg.textContent = "Checking…";
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("pw").value.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(Gt.salt), iterations:Gt.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    if (!(await tryKey(k))){ msg.textContent = "That password didn't work."; return; }
    if ($("remember").checked){ try { await idbPut({key:k, salt:Gt.salt, exp:Date.now() + 30*864e5}); } catch(e){} }
    open(k);
  });
})();
