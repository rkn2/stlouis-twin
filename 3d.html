<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Twin 3D</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1f3f5; --surface:#ffffff; --ink:#18202a; --ink-2:#465262; --muted:#6c7888; --line:#d9dfe6; --grid:#eceff3;
  --accent:#1e5f8e; --accent-soft:#e2edf6; --warn:#a86a00; --stage:#11161c;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:Bitter,Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0e1216; --surface:#161c22; --ink:#e7ecf1; --ink-2:#b3bdc8; --muted:#8793a0; --line:#28313a; --grid:#1f262e;
    --accent:#7fb6e0; --accent-soft:#1b2833; --warn:#e2a93a; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0e1216; --surface:#161c22; --ink:#e7ecf1; --ink-2:#b3bdc8; --muted:#8793a0; --line:#28313a; --grid:#1f262e;
  --accent:#7fb6e0; --accent-soft:#1b2833; --warn:#e2a93a; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.wrap{display:flex;flex-direction:column;min-height:100%;max-width:1500px;margin:0 auto;padding:12px 16px 24px;gap:10px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{margin:0;font:600 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 24px/1.2 var(--serif)}
.sub{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.meta{font:12px var(--mono);color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.chip select{font:inherit;border:0;background:transparent;color:var(--ink);padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;padding:4px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
a.chip{text-decoration:none}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px}
.stage{position:relative;height:min(78vh,1400px);min-height:440px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--stage)}
canvas#c{width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;height:min(78vh,1400px);min-height:440px}
@media (max-width:900px){ main{grid-template-columns:1fr} .stage{height:62vh} .panel{height:auto} }
.panel h2{margin:0 0 6px;font:700 17px/1.3 var(--serif)}
.panel h3{margin:16px 0 6px;font:600 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel p{margin:0 0 8px;color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 6px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:11.5px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.back{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.35}
.legend b{display:block;font-weight:600;margin-bottom:4px}
.legend .row{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.hint{position:absolute;right:10px;bottom:10px;font:11.5px var(--sans);color:#d5dbe1;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:4px}
details.about{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
details.about summary{cursor:pointer;font-weight:600}
details.about p{color:var(--ink-2);max-width:900px}
a{color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs a{padding:7px 16px;font-weight:600;font-size:14px;color:var(--ink-2);text-decoration:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;margin-bottom:-1px}
.tabs a:hover{color:var(--ink);background:var(--surface)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface);border-color:var(--line)}

#status{position:absolute;inset:0;display:grid;place-items:center;color:#c9d1d9;font-size:13px}
#status pre{white-space:pre-wrap;color:#e2a93a;font:12px var(--mono);max-width:90%}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:5000;padding:16px}
#gate form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:10px;width:min(360px,100%)}
#gate input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#gate button{font:inherit;font-weight:600;padding:8px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"},
 "integrity":{"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js":"sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ",
  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js":"sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP"}}</script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Penn State Heritage 3D Lab · Digital Twin Hub</p>
      <h1 id="title">Digital twin, 3D</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="tabs" aria-label="Views">
    <a href="./">Map</a>
    <a href="3d.html" aria-current="page">3D</a>
  </nav>
  <div class="controls">
    <div class="seg" role="group" aria-label="Imagery">
      <button type="button" data-img="0" aria-pressed="false">Before (Mar 2, 2025)</button>
      <button type="button" data-img="1" aria-pressed="true">After (May 17, 2025)</button>
    </div>
    <label class="chip">Walls <select id="wall" aria-label="Color walls by">
      <option value="ds">observed damage</option>
      <option value="demo">City demolition record</option>
      <option value="src">footprint source</option>
      <option value="plain">plain</option>
    </select></label>
    <div class="seg" role="group" aria-label="Views">
      <button type="button" data-view="path">Whole path</button>
      <button type="button" data-view="core">EF3 core</button>
      <button type="button" data-view="low">Low, close</button>
    </div>
  </div>
  <main>
    <div class="stage" id="stage">
      <canvas id="c" aria-label="3D model"></canvas>
      <div class="legend" id="legend"></div>
      <div class="hint">drag to orbit · right-drag to pan · scroll to zoom · click a building · imagery sharpens as you move in</div>
      <div id="status">Loading…</div>
    </div>
    <aside class="panel" id="panel" aria-label="Details"></aside>
  </main>
  <details class="about">
    <summary>About this model and its data</summary>
    <div id="about"></div>
    <p><button class="back" id="forget" type="button">Forget this device (sign out)</button></p>
  </details>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------------------------------------------------------------- data access (plain in dev, AES-GCM behind the gate when published)
let KEY = null, FORGET = null;
const DATA = "data/";
async function getBuf(name){
  const url = DATA + name + (KEY ? ".enc" : "");
  let res = await fetch(url);
  // GitHub Pages answers the odd burst of tile requests with a transient 503 (seen 2026-10-07; the same file
  // returned 200 a moment later), so retry a 5xx once and say so in the console
  if (res.status >= 500){ console.warn(`${url}: HTTP ${res.status}, retrying once`); await new Promise(r => setTimeout(r, 600)); res = await fetch(url); }
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const buf = await res.arrayBuffer();
  if (!KEY) return buf;
  const u = new Uint8Array(buf);
  try { return await crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(0,12)}, KEY, u.slice(12)); }
  catch(e){ throw new Error(`${url}: decrypt failed (${e.name})`); }
}
const getJSON = async n => JSON.parse(new TextDecoder().decode(await getBuf(n)));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DSN = ["DS0 none", "DS1 slight", "DS2 moderate", "DS3 extensive", "DS4 complete"];
// validated ordinal ramp (light-mode steps: walls are lit 3D surfaces); demolition uses the fixed status colours, always labelled
const DSC = [0xa8a69f, 0xec9560, 0xd9652f, 0xb03d18, 0x6e1a0a], NOSURV = 0xd8d6cf, KEEP = 0xc9c7bf;
const DEMOC = {2:0xd03b3b, 1:0xfab219, 0:0xc9c7bf, "-1":0x8fa3b8}, SRCC = {0:0xc9c7bf, 1:0x8fa3b8};

let S, T, NM, renderer, scene, camera, controls, NMH = {}, mode = 1, sel = -1, terr;
const canvas = $("c"), statusEl = $("status");
const R = 6378137, WORLD = 2 * Math.PI * R;

// ---------------------------------------------------------------- scene
function setup(){
  renderer = new THREE.WebGLRenderer({canvas, antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x11161c);
  camera = new THREE.PerspectiveCamera(40, 1, 2, 60000); camera.up.set(0, 0, 1);
  controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 25; controls.maxDistance = 25000;
  controls.screenSpacePanning = false;
  const resize = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(canvas); resize();
}
const GRAY = new THREE.DataTexture(new Uint8Array([138, 138, 134, 0]), 1, 1); GRAY.needsUpdate = true;
const SHARED = {mode:{value:1}, selB:{value:-1}, L:{value:new THREE.Vector3(-0.4, -0.5, 0.77).normalize()}};
function blockMaterial(){
  return new THREE.ShaderMaterial({
    uniforms:{tB:{value:GRAY}, tA:{value:GRAY}, bb:{value:new THREE.Vector4(0, 0, 1, 1)}, ...SHARED}, side:THREE.DoubleSide,
    vertexShader:`attribute float aRoof; attribute float aBid; attribute vec3 color; varying vec2 vxy; varying vec3 vn; varying float vr; varying vec3 vc; varying float vb;
      void main(){ vxy = position.xy; vn = normal; vr = aRoof; vc = color; vb = aBid; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader:`uniform sampler2D tB; uniform sampler2D tA; uniform vec4 bb; uniform int mode; uniform vec3 L; uniform float selB;
      varying vec2 vxy; varying vec3 vn; varying float vr; varying vec3 vc; varying float vb;
      void main(){
        vec2 uv = vec2((vxy.x - bb.x) / (bb.z - bb.x), (vxy.y - bb.y) / (bb.w - bb.y));
        bool after = mode == 1;
        vec4 tx = after ? texture2D(tA, uv) : texture2D(tB, uv);
        if (tx.a < 0.5 && vr > 0.5 && vb < -0.5) discard;          // ground with no imagery for this date: leave it out
        vec3 img = tx.a < 0.5 ? vec3(0.54, 0.54, 0.52) : tx.rgb;
        float s = 0.72 + 0.38 * max(dot(normalize(vn), L), 0.0);
        vec3 c = vr > 0.5 ? img : vc * s;
        if (selB >= 0.0 && abs(vb - selB) < 0.5) c = mix(c, vec3(1.0, 0.95, 0.4), vr > 0.5 ? 0.25 : 0.45);
        gl_FragColor = vec4(c, 1.0);
#include <colorspace_fragment>
      }`,
  });
}
const BL = [];      // per block: {mat, terrain, bmesh, faceB, level, busy, center}
function buildBlocks(){
  const G = T.grid;
  T.blocks.forEach((b, k) => {
    const mat = blockMaterial(), W = b.x1 - b.x0, H = b.y1 - b.y0;
    const g = new THREE.PlaneGeometry(W, H, G - 1, G - 1), p = g.attributes.position;
    for (let i = 0; i < p.count; i++){ p.setX(i, p.getX(i) + (b.x0 + b.x1) / 2); p.setY(i, p.getY(i) + (b.y0 + b.y1) / 2); p.setZ(i, terr[k * G * G + i] - 0.2); }
    g.computeVertexNormals(); const n = p.count;
    g.setAttribute("aRoof", new THREE.Float32BufferAttribute(new Float32Array(n).fill(1), 1));
    g.setAttribute("aBid", new THREE.Float32BufferAttribute(new Float32Array(n).fill(-1), 1));
    g.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
    const tm = new THREE.Mesh(g, mat); scene.add(tm);
    BL.push({k, b, mat, terrain:tm, bmesh:null, faceB:[], level:-1, want:0, busy:false, center:new THREE.Vector3((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, 0), tex:[]});
  });
  // buildings, one merged mesh per block
  const per = BL.map(() => ({pos:[], nor:[], roof:[], bid:[], idx:[], faceB:[]}));
  T.buildings.forEach((o, k) => {
    const A = per[o.b], R0 = [];
    for (let i = 0; i < o.r.length; i += 2) R0.push([o.r[i], o.r[i + 1]]);
    const Rg = R0.slice(0, -1); if (Rg.length < 3) return;
    const z0 = o.z, z1 = o.z + (o.h || 4);
    for (let i = 0; i < Rg.length; i++){
      const a = Rg[i], c = Rg[(i + 1) % Rg.length], dx = c[0] - a[0], dy = c[1] - a[1], Lw = Math.hypot(dx, dy) || 1, v = A.pos.length / 3;
      A.pos.push(a[0], a[1], z0, c[0], c[1], z0, c[0], c[1], z1, a[0], a[1], z1);
      for (let j = 0; j < 4; j++){ A.nor.push(dy / Lw, -dx / Lw, 0); A.roof.push(0); A.bid.push(k); }
      A.idx.push(v, v + 1, v + 2, v, v + 2, v + 3); A.faceB.push(k, k);
    }
    const v0 = A.pos.length / 3, tri = THREE.ShapeUtils.triangulateShape(Rg.map(p => new THREE.Vector2(p[0], p[1])), []);
    for (const p of Rg){ A.pos.push(p[0], p[1], z1); A.nor.push(0, 0, 1); A.roof.push(1); A.bid.push(k); }
    for (const t of tri){ A.idx.push(v0 + t[0], v0 + t[1], v0 + t[2]); A.faceB.push(k); }
  });
  per.forEach((A, k) => {
    if (!A.pos.length) return;
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(A.pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(A.nor, 3));
    g.setAttribute("aRoof", new THREE.Float32BufferAttribute(A.roof, 1)); g.setAttribute("aBid", new THREE.Float32BufferAttribute(A.bid, 1));
    g.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(A.pos.length), 3)); g.setIndex(A.idx);
    BL[k].bmesh = new THREE.Mesh(g, BL[k].mat); BL[k].faceB = A.faceB; scene.add(BL[k].bmesh);
  });
  colorWalls();
}
function wallHex(o){
  const m = $("wall").value;
  if (m === "ds") return o.s && o.s[1] >= 0 ? DSC[o.s[1]] : NOSURV;
  if (m === "demo") return DEMOC[o.demo];
  if (m === "src") return SRCC[o.src];
  return KEEP;
}
function colorWalls(){
  const c = new THREE.Color();
  for (const B of BL){
    if (!B.bmesh) continue;
    const col = B.bmesh.geometry.attributes.color, bid = B.bmesh.geometry.attributes.aBid;
    for (let i = 0; i < bid.count; i++){ c.setHex(wallHex(T.buildings[bid.getX(i)])); col.setXYZ(i, c.r, c.g, c.b); }
    col.needsUpdate = true;
  }
  legend();
}
function legend(){
  const m = $("wall").value, row = (hex, l) => `<div class="row"><span class="sw" style="background:#${(+hex).toString(16).padStart(6, "0")}"></span>${esc(l)}</div>`;
  $("legend").innerHTML = m === "ds" ? "<b>Walls: observed damage</b>" + DSN.map((l, k) => row(DSC[k], l)).join("") + row(NOSURV, "not surveyed")
    : m === "demo" ? "<b>Walls: City demolition record</b>" + row(DEMOC[2], "demolished since May 16, 2025") + row(DEMOC[1], "permit filed, not completed") + row(DEMOC[0], "none recorded") + row(DEMOC[-1], "outside the City: no City data")
    : m === "src" ? "<b>Walls: footprint source</b>" + row(SRCC[0], "City records (pre-tornado)") + row(SRCC[1], "Overture Maps 2026 (outside the City)")
    : "<b>Walls</b>" + row(KEEP, "all buildings");
}

// ---------------------------------------------------------------- block imagery, level of detail by camera distance
// level 0: 3x3 zoom-15 tiles into 256 px; 1: 6x6 zoom-17 (block + 1-tile margin) into 1024; 2: 10x10 zoom-18 into 2048
const LV = [{z:15, n:1, px:256}, {z:17, n:4, px:1024}, {z:18, n:8, px:2048}], CAP = {2:4, 1:14};
const nmHas = (e, z, x, y) => NMH[e] && NMH[e][z] && NMH[e][z].has(x + "/" + y);
const ext = z => (NM.ext || {})[z] || "jpg";
const MX0 = T0 => T0.lon0 * Math.PI / 180 * R, MY0 = T0 => R * Math.log(Math.tan(Math.PI / 4 + T0.lat0 * Math.PI / 360));
async function compose(epoch, B, lv){
  const L = LV[lv], f = 2 ** (L.z - T.zoom), x0 = B.b.x * f - 1, y0 = B.b.y * f - 1, n = L.n + 2;
  const cv = document.createElement("canvas"); cv.width = cv.height = L.px; const g = cv.getContext("2d"), s = L.px / n;
  const jobs = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
    const x = x0 + i, y = y0 + j; if (!nmHas(epoch, L.z, x, y)) continue;
    jobs.push(getBuf(`nm/${epoch}/${L.z}/${x}/${y}.${ext(L.z)}`).then(b => createImageBitmap(new Blob([b]))).then(bmp => { g.drawImage(bmp, i * s, j * s, s, s); bmp.close(); }).catch(e => console.error(e)));
  }
  await Promise.all(jobs);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter;
  const TS = WORLD / 2 ** L.z, mx0 = MX0(T), my0 = MY0(T), K = T.K;
  const bb = new THREE.Vector4((x0 * TS - WORLD / 2 - mx0) * K, (WORLD / 2 - (y0 + n) * TS - my0) * K, ((x0 + n) * TS - WORLD / 2 - mx0) * K, (WORLD / 2 - y0 * TS - my0) * K);
  return {t, bb};
}
async function setLevel(B, lv){
  B.busy = true;
  try {
    const [b, a] = await Promise.all(["before", "after"].map(e => compose(e, B, lv)));
    for (const t of B.tex) t.dispose();
    B.tex = [b.t, a.t]; B.mat.uniforms.tB.value = b.t; B.mat.uniforms.tA.value = a.t; B.mat.uniforms.bb.value = b.bb; B.level = lv;
  } finally { B.busy = false; }
}
let lodBusy = false;
async function lod(){
  if (lodBusy || !BL.length) return; lodBusy = true;
  try {
    const cam = camera.position, tgt = controls.target;
    const d = BL.map(B => ({B, d:Math.min(cam.distanceTo(B.center), tgt.distanceTo(B.center) + cam.distanceTo(tgt) * 0.35)})).sort((a, b) => a.d - b.d);
    const counts = {2:0, 1:0};
    for (const {B, d: dist} of d){
      let w = dist < 1600 ? 2 : dist < 5000 ? 1 : 0;
      while (w > 0 && counts[w] >= CAP[w]) w--;
      if (w > 0) counts[w]++;
      B.want = w;
    }
    // one change at a time, nearest first: upgrades before downgrades
    const next = d.find(({B}) => !B.busy && B.want > B.level) || d.slice().reverse().find(({B}) => !B.busy && B.want < B.level);
    if (next) await setLevel(next.B, next.B.want);
  } catch(e){ console.error(e); }
  lodBusy = false;
}

// ---------------------------------------------------------------- imagery date
function setMode(m){ mode = m; SHARED.mode.value = m; document.querySelectorAll("[data-img]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.img === m)); }

// ---------------------------------------------------------------- picking + panel
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e){
  const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const meshes = BL.filter(B => B.bmesh).map(B => B.bmesh), h = ray.intersectObjects(meshes)[0];
  if (!h) return;
  const B = BL.find(B => B.bmesh === h.object); sel = B.faceB[h.faceIndex]; SHARED.selB.value = sel; renderBuilding(T.buildings[sel]);
}
let down = null;
canvas.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
canvas.addEventListener("pointerup", e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 4) pick(e); down = null; });
function renderOverview(){
  sel = -1; SHARED.selB.value = -1;
  const city = T.buildings.filter(o => o.src === 0), surv = city.filter(o => o.s && o.s[1] >= 0);
  const rows = [0, 1, 2, 3, 4].map(k => { const g = surv.filter(o => o.s[1] === k), d = g.filter(o => o.demo === 2).length, f = g.filter(o => o.demo === 1).length;
    return `<tr><td>${DSN[k]}</td><td>${g.length.toLocaleString()}</td><td>${d}</td><td>${g.length ? Math.round(100 * d / g.length) + "%" : "–"}</td><td>${f}</td></tr>`; }).join("");
  const un = city.filter(o => !o.s || o.s[1] < 0), und = un.filter(o => o.demo === 2).length;
  $("panel").innerHTML = `<h2>${esc(S.path3d.headline)}</h2><p>${esc(S.path3d.intro)}</p>
    <h3>City footprints demolished since the tornado</h3>
    <table><thead><tr><th>Observed</th><th>Buildings</th><th>Demolished</th><th>Share</th><th>Permit filed</th></tr></thead><tbody>${rows}
    <tr><td>not surveyed</td><td>${un.length.toLocaleString()}</td><td>${und}</td><td>${un.length ? Math.round(100 * und / un.length) + "%" : "–"}</td><td>${un.filter(o => o.demo === 1).length}</td></tr></tbody></table>
    <p class="meta" style="margin-top:4px">${esc(S.path3d.tableNote)}</p>
    <h3>What the model is</h3><p>${esc(S.path3d.what)}</p>`;
}
function renderBuilding(o){
  const s = o.s;
  $("panel").innerHTML = `<p><button class="back" id="bk" type="button">← Overview</button></p>
    <h2>${s && s[1] >= 0 ? DSN[s[1]] : "Not surveyed"}</h2>
    <dl class="kv">
      ${s ? `<dt>Survey</dt><dd>${esc(S.surveys[s[5]])}</dd><dt>Archetype</dt><dd>T${s[2]}</dd><dt>NWS EF zone</dt><dd>${s[3] >= 0 ? "EF" + s[3] : "–"}</dd><dt>Year built</dt><dd>${s[4] ?? "–"}</dd>` : ""}
      <dt>Footprint</dt><dd>${o.src === 0 ? "City records (pre-tornado)" : "Overture Maps 2026" + (o.osrc ? " (" + esc(o.osrc) + ")" : "")}</dd>
      <dt>Height</dt><dd>${o.h ? o.h.toFixed(1) + " m" : "unknown, drawn at 4 m"}</dd>
      <dt>Roof form</dt><dd>${esc(o.roof || "–")}</dd>
      ${o.sqft ? `<dt>Floor area</dt><dd>${Math.round(o.sqft).toLocaleString()} sq ft</dd>` : ""}
      ${o.nhd ? `<dt>Neighborhood</dt><dd>${esc(o.nhd)}</dd>` : ""}
      <dt>City demolition</dt><dd>${o.demo === -1 ? "outside the City (no City data)" : o.demo === 2 ? "demolished since the tornado (" + esc(o.demoDate) + ")" : o.demo === 1 ? "permit filed " + esc(o.demoDate) + ", not completed" : "none recorded"}</dd>
    </dl>`;
  $("bk").onclick = renderOverview;
}

// ---------------------------------------------------------------- views
function view(v){
  const f = T.focus, xs = T.blocks.flatMap(b => [b.x0, b.x1]), ys = T.blocks.flatMap(b => [b.y0, b.y1]);
  const c = new THREE.Vector3((Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2, 0);
  const V = {path:[c, [0.03, -0.4, 0.92], 21000], core:[new THREE.Vector3(f[0], f[1], 0), [0.35, -0.75, 0.62], 1100], low:[new THREE.Vector3(f[0], f[1], 0), [0.2, -0.95, 0.14], 420]}[v];
  controls.target.copy(V[0]); camera.position.copy(V[0]).add(new THREE.Vector3(...V[1]).normalize().multiplyScalar(V[2])); controls.update();
}

// ---------------------------------------------------------------- boot
function report(what, e){ const pre = document.createElement("pre"); pre.textContent = `Could not load ${what}\n${e && e.stack || e}`; statusEl.replaceChildren(pre); }
async function boot(){
  try {
    statusEl.textContent = "Loading model…";
    [S, T] = await Promise.all([getJSON("site.json"), getJSON("path3d.json")]);
    terr = new Float32Array(await getBuf("path3d_terrain.bin"));
    try { NM = await getJSON("nearmap_meta.json"); } catch(e){ NM = null; }
    if (!NM) throw new Error("This build has no aerial imagery, which the 3D view needs.");
    for (const [e, m] of Object.entries(NM.epochs)){ NMH[e] = {}; for (const [z, l] of Object.entries(m.tiles)) NMH[e][z] = new Set(l.map(([x, y]) => x + "/" + y)); }
    document.title = S.site.short + " 3D"; $("title").textContent = S.path3d.title; $("subtitle").textContent = S.path3d.sub;
    $("meta").textContent = `${T.buildings.length.toLocaleString()} buildings · ground: USGS 3DEP · built ${T.generated}`;
    $("about").innerHTML = S.path3d.about.map(t => `<p>${esc(t)}</p>`).join("");
    setup(); buildBlocks();
    await Promise.all(BL.map(B => setLevel(B, 0)));
    view("core"); setMode(1); renderOverview();
    statusEl.hidden = true;
    $("wall").onchange = colorWalls;
    document.querySelectorAll("[data-img]").forEach(b => b.onclick = () => setMode(+b.dataset.img));
    document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => view(b.dataset.view));
    $("forget").onclick = async () => { if (FORGET) await FORGET(); location.reload(); };
    setInterval(lod, 250);
  } catch(e){ report("the 3D model", e); return; }
  (function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
}

// ---------------------------------------------------------------- gate (shared store with the map page, so one unlock covers both)
(async function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let Gt = null;
  try { const r = await fetch("gate.json"); if (r.ok) Gt = await r.json(); } catch(e){}
  if (!Gt) return boot();
  const gate = document.createElement("div"); gate.id = "gate";
  gate.innerHTML = `<form id="gateform"><p class="eyebrow">Penn State Heritage 3D Lab</p><h1 style="font-size:22px">Digital twin</h1>
    <label for="pw" class="sub">Enter the password to view.</label><input id="pw" type="password" autocomplete="current-password" required>
    <label class="sub" style="display:flex;gap:8px;align-items:center"><input id="remember" type="checkbox" checked> Remember on this device for 30 days</label>
    <button type="submit">View</button><p id="gatemsg" class="sub" role="alert" style="margin:0;min-height:1.2em"></p></form>`;
  document.body.appendChild(gate); document.querySelector(".wrap").inert = true; $("pw").focus();
  const tryKey = async k => { const u = b64(Gt.check); try { await crypto.subtle.decrypt({name:"AES-GCM", iv:u.slice(0,12)}, k, u.slice(12)); return true; } catch(e){ return false; } };
  const open = k => { KEY = k; gate.remove(); document.querySelector(".wrap").inert = false; FORGET = idbDel; boot(); };
  const DB = "stl-twin";
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idbGet = async () => { const db = await idb(); return new Promise(res => { const q = db.transaction("k").objectStore("k").get("key"); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); };
  const idbPut = async v => { const db = await idb(); return new Promise(res => { const t = db.transaction("k", "readwrite"); t.objectStore("k").put(v, "key"); t.oncomplete = res; t.onerror = res; }); };
  const idbDel = async () => { try { const db = await idb(); db.transaction("k", "readwrite").objectStore("k").delete("key"); } catch(e){} };
  try { const s = await idbGet();
    if (s && s.exp > Date.now() && s.salt === Gt.salt && await tryKey(s.key)) return open(s.key);
    if (s) await idbDel(); } catch(e){}
  $("gateform").addEventListener("submit", async e => {
    e.preventDefault(); const msg = $("gatemsg"); msg.textContent = "Checking…";
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("pw").value.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(Gt.salt), iterations:Gt.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    if (!(await tryKey(k))){ msg.textContent = "That password didn't work."; return; }
    if ($("remember").checked){ try { await idbPut({key:k, salt:Gt.salt, exp:Date.now() + 30*864e5}); } catch(e){} }
    open(k);
  });
})();
</script>
